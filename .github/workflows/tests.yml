# Runs the test suite (about 70 fast tests) on every push and pull request.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  reproduce:
    # Cross-platform check on Linux x86-64: replay the COMMITTED logs, then re-run all 180
    # experiments and compare with the committed summary.csv (ints exact, floats within 1e-9).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/replay.py --all
      - run: cp results/summary.csv "$RUNNER_TEMP/committed_summary.csv"
      - run: python scripts/run_experiments.py
      - run: python scripts/check_summary.py results/summary.csv "$RUNNER_TEMP/committed_summary.csv"
